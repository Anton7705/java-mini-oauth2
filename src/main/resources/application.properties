spring.application.name=mini-oauth2

# --- default datastore: file-based H2, survives application restarts ---
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./data/mini-oauth2;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:init.sql

# --- authorization server ---
auth.secret=dev-only-secret-change-me-in-production-0123456789
auth.issuer=mini-auth
auth.audience=payments-api
auth.access-ttl-sec=900
auth.refresh-ttl-days=14
auth.clock-skew-sec=60
auth.seed-demo-data=true
auth.rate-limit.enabled=false
auth.rate-limit.requests-per-minute=60

# --- resource server (HS256 is symmetric, so RS shares the auth secret) ---
rs.secret=${auth.secret}
rs.issuer=mini-auth
rs.audience=payments-api
rs.clock-skew-sec=60
rs.auth-server-url=http://localhost:8080
rs.introspection-enabled=true

logging.level.ru.yandex.practicum.oauth0=INFO
